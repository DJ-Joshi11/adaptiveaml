# AdaptiveAML configuration. Every tunable decision lives here so a run is reproducible.
seed: 42

data:
  alerts_csv: data/raw/synthetic_alerts.csv
  transactions_csv: data/raw/synthetic_transactions.csv
  interim_dir: data/interim
  processed_dir: data/processed
  # auto | datetime | seconds_before_alert | seconds_forward
  timestamp_mode: auto

split:                      # by alert quarter; dates are only accurate to the quarter
  train: ["2020Q1", "2020Q2", "2020Q3", "2020Q4"]
  valid: ["2021Q1", "2021Q2"]
  test:  ["2021Q3", "2021Q4"]

windows:
  recent_days: 30           # regression target window: days [0, 30) before the alert
  history_days: 365         # history window: days [30, 365]
  large_size_quantile: 0.90 # "large transaction" cut-off, learned on training quarters only

evaluation:
  review_budget: 0.20       # analysts review the top 20% of the queue
  safety_recall: 0.95       # secondary operating point: keep >= 95% of reports
  n_bootstrap: 1000
  n_coef_bootstrap: 200

artifacts_dir: artifacts
